name: 🔁 Powtórka Zdania Dnia

on:
  schedule:
    - cron: "0 7 * * *"    # 9:00 CEST
    - cron: "0 9 * * *"    # 11:00 CEST
    - cron: "30 9 * * *"   # 11:30 CEST
    - cron: "0 11 * * *"   # 13:00 CEST
    - cron: "30 11 * * *"  # 13:30 CEST
    - cron: "0 13 * * *"   # 15:00 CEST
    - cron: "30 13 * * *"  # 15:30 CEST
    - cron: "0 15 * * *"   # 17:00 CEST
    - cron: "30 15 * * *"  # 17:30 CEST
    - cron: "0 17 * * *"   # 19:00 CEST
  workflow_dispatch:

jobs:
  repeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MODE: repeat
        run: python scripts/bot.py
